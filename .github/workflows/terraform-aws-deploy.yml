# Deploy via Pipeline: the agent POSTs { "ref": "<generated-branch>" }
# to this workflow. GitHub runs THIS file from that branch and
# actions/checkout uses the same ref, so plan/apply use the generated .tf files.
name: Terraform AWS Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-aws-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover Terraform configurations
    runs-on: ubuntu-latest
    outputs:
      directories: ${{ steps.terraform.outputs.directories }}
      found: ${{ steps.terraform.outputs.found }}
    steps:
      - name: Check out dispatched branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Show workflow ref
        run: |
          echo "github.ref=${{ github.ref }}"
          echo "github.ref_name=${{ github.ref_name }}"
          echo "github.sha=${{ github.sha }}"

      - name: Find Terraform directories
        id: terraform
        shell: bash
        run: |
          directories=$(find . -type f -name '*.tf' \
            -not -path '*/.terraform/*' \
            -not -path './.git/*' \
            -printf '%h\n' |
            sed 's|^\./||' |
            sort -u |
            jq -R -s -c 'split("\n") | map(select(length > 0)) | map(if . == "" then "." else . end)')

          echo "directories=$directories" >> "$GITHUB_OUTPUT"

          if [ "$directories" = "[]" ] || [ -z "$directories" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Terraform - ${{ matrix.directory }}
    needs: discover
    if: needs.discover.outputs.found == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.discover.outputs.directories) }}
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Check out dispatched branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: terraform-github-actions
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false -no-color

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -no-color -auto-approve tfplan
