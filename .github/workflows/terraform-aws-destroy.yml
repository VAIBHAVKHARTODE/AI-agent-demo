# Destroy AWS resources from main.
#
# Pipeline:
#   1) Discover (always main)
#   2) Resources to delete — readable LIST
#   3) ✅ Confirm — proceed with deletion (Environment approval)
#   4) Destroy
#
# Manual:
#   - Preview: leave confirm_destroy unchecked → list only, no delete
#   - Delete:  check confirm_destroy → approve ✅ job → destroy
#
# Repo setup: Settings → Environments → "terraform-destroy" → Required reviewers
name: Terraform AWS Destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "☑️ After the resource LIST, show ✅ Confirm step to proceed with deletion. Unchecked = list only."
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: terraform-aws-destroy-${{ github.repository }}-main
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY || format('{0}/terraform.tfstate', github.repository) }}
  TF_STATE_REGION: ${{ vars.TF_STATE_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"
  # Always main — agent UI or manual
  TERRAFORM_REF: main

jobs:
  discover:
    name: "1 · Discover (main)"
    runs-on: ubuntu-latest
    outputs:
      directories: ${{ steps.terraform.outputs.directories }}
      found: ${{ steps.terraform.outputs.found }}
      terraform_ref: ${{ steps.ref.outputs.terraform_ref }}
      will_destroy: ${{ steps.mode.outputs.will_destroy }}
    steps:
      - name: Force main branch
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          echo "terraform_ref=main" >> "$GITHUB_OUTPUT"
          echo "Destroy always uses branch: main"

      - name: Resolve checkbox
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          CONFIRM="${{ inputs.confirm_destroy }}"
          if [ "$CONFIRM" = "true" ] || [ "$CONFIRM" = "True" ]; then
            echo "will_destroy=true" >> "$GITHUB_OUTPUT"
          else
            echo "will_destroy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Find Terraform directories
        id: terraform
        shell: bash
        run: |
          if ls ./*.tf >/dev/null 2>&1; then
            directories='["."]'
          else
            directories=$(find . -type f -name '*.tf' \
              -not -path '*/.terraform/*' \
              -not -path './.git/*' \
              -printf '%h\n' |
              sed 's|^\./||' |
              sort -u |
              jq -R -s -c 'split("\n") | map(select(length > 0)) | map(if . == "" then "." else . end)')
          fi

          echo "directories=$directories" >> "$GITHUB_OUTPUT"

          if [ "$directories" = "[]" ] || [ -z "$directories" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

  plan-destroy:
    name: "2 · Resources to delete - ${{ matrix.directory }}"
    needs: discover
    if: needs.discover.outputs.found == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.discover.outputs.directories) }}
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Artifact key
        id: artifact
        shell: bash
        run: |
          DIR="${{ matrix.directory }}"
          KEY=$(echo "$DIR" | sed 's#[^A-Za-z0-9._-]#-#g')
          if [ -z "$KEY" ] || [ "$KEY" = "." ]; then KEY="root"; fi
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: terraform-github-actions-destroy-plan
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Ensure S3 backend
        run: |
          if [ -f backend.tf ] && grep -q 'bucket' backend.tf; then
            exit 0
          fi
          if [ -z "${TF_STATE_BUCKET}" ]; then
            echo "::error::Set TF_STATE_BUCKET (Settings or GitHub variable)."
            exit 1
          fi
          printf '%s\n' 'terraform {' '  backend "s3" {}' '}' > backend.tf

      - name: Terraform init
        run: |
          if [ -f backend.tf ] && grep -q 'bucket' backend.tf; then
            terraform init -input=false -no-color -reconfigure
          elif [ -n "${TF_STATE_BUCKET}" ]; then
            terraform init -input=false -no-color -reconfigure \
              -backend-config="bucket=${TF_STATE_BUCKET}" \
              -backend-config="key=${TF_STATE_KEY}" \
              -backend-config="region=${TF_STATE_REGION}" \
              -backend-config="encrypt=true"
          else
            echo "::error::No S3 backend configured."
            exit 1
          fi

      - name: Terraform plan destroy
        run: |
          set -euo pipefail
          terraform plan -destroy -input=false -no-color -out=destroy.tfplan > /dev/null
          terraform show -json destroy.tfplan > destroy-plan.json

      # Readable list only (Summary + logs)
      - name: Resources to delete (list)
        id: summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          TYPE_LABELS = {
              "aws_instance": "EC2 Instance",
              "aws_security_group": "Security Group",
              "aws_security_group_rule": "Security Group Rule",
              "aws_vpc_security_group_egress_rule": "SG Egress Rule",
              "aws_vpc_security_group_ingress_rule": "SG Ingress Rule",
              "aws_eip": "Elastic IP",
              "aws_subnet": "Subnet",
              "aws_vpc": "VPC",
              "aws_s3_bucket": "S3 Bucket",
          }

          data = json.loads(Path("destroy-plan.json").read_text(encoding="utf-8"))
          changes = data.get("resource_changes") or []

          rows = []
          seen = set()
          for rc in changes:
              actions = (rc.get("change") or {}).get("actions") or []
              if "delete" not in actions:
                  continue
              addr = rc.get("address") or ""
              if not addr or addr in seen:
                  continue
              seen.add(addr)
              before = (rc.get("change") or {}).get("before") or {}
              if not isinstance(before, dict):
                  before = {}
              aws_id = before.get("id") or before.get("arn") or before.get("instance_id") or ""
              tags = before.get("tags") or before.get("tags_all") or {}
              name_tag = ""
              if isinstance(tags, dict):
                  name_tag = tags.get("Name") or tags.get("name") or ""
              rtype = rc.get("type") or ""
              rows.append({
                  "type": rtype,
                  "label": TYPE_LABELS.get(rtype, rtype.replace("aws_", "").replace("_", " ").title()),
                  "address": addr,
                  "name_tag": str(name_tag) if name_tag else "—",
                  "aws_id": str(aws_id) if aws_id else "—",
              })

          # --- Job Summary (readable list) ---
          md = []
          md.append(f"## Resources to delete ({len(rows)})")
          md.append("")
          if not rows:
              md.append("_No resources to delete._")
          else:
              for i, r in enumerate(rows, 1):
                  md.append(f"### {i}. {r['label']}")
                  md.append(f"- **Type:** `{r['type']}`")
                  md.append(f"- **Address:** `{r['address']}`")
                  md.append(f"- **Name:** {r['name_tag']}")
                  md.append(f"- **AWS ID:** `{r['aws_id']}`")
                  md.append("")

          summary_text = "\n".join(md).rstrip() + "\n"
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(summary_text, encoding="utf-8")

          # --- Console log (same list, easy to scan) ---
          print("")
          print(f"Resources to delete ({len(rows)})")
          print("=" * 56)
          if not rows:
              print("  (none)")
          else:
              for i, r in enumerate(rows, 1):
                  print(f"{i}. {r['label']}")
                  print(f"   Type     : {r['type']}")
                  print(f"   Address  : {r['address']}")
                  print(f"   Name     : {r['name_tag']}")
                  print(f"   AWS ID   : {r['aws_id']}")
                  print("")
          print("=" * 56)

          with Path("resources-to-delete.txt").open("w", encoding="utf-8") as fh:
              for r in rows:
                  fh.write(f"{r['type']}\t{r['address']}\t{r['name_tag']}\t{r['aws_id']}\n")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as fh:
              fh.write(f"has_destroy={'true' if rows else 'false'}\n")
              fh.write(f"destroy_count={len(rows)}\n")
          PY

      - name: Upload destroy plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: destroy-plan-${{ steps.artifact.outputs.key }}
          path: |
            ${{ matrix.directory }}/destroy.tfplan
            ${{ matrix.directory }}/destroy-plan.json
            ${{ matrix.directory }}/resources-to-delete.txt
          if-no-files-found: error
          retention-days: 5

  # Mid-pipeline checkmark: review list above, then approve to proceed with deletion
  confirm-delete:
    name: "✅ Confirm — proceed with deletion"
    needs: [discover, plan-destroy]
    if: |
      always() &&
      needs.discover.outputs.found == 'true' &&
      needs.discover.outputs.will_destroy == 'true' &&
      needs.plan-destroy.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: terraform-destroy
    steps:
      - name: "✅ Approved — proceed with deletion"
        run: |
          {
            echo "## ✅ Proceed with deletion"
            echo ""
            echo "Human approved. Destroy will run on **main** next."
            echo ""
            echo "- Review the **Resources to delete** list in the previous job before approving."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Approved. Proceeding to destroy on main."

  destroy:
    name: "4 · Delete resources - ${{ matrix.directory }}"
    needs: [discover, plan-destroy, confirm-delete]
    if: |
      always() &&
      needs.discover.outputs.found == 'true' &&
      needs.discover.outputs.will_destroy == 'true' &&
      needs.plan-destroy.result == 'success' &&
      needs.confirm-delete.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.discover.outputs.directories) }}
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Artifact key
        id: artifact
        shell: bash
        run: |
          DIR="${{ matrix.directory }}"
          KEY=$(echo "$DIR" | sed 's#[^A-Za-z0-9._-]#-#g')
          if [ -z "$KEY" ] || [ "$KEY" = "." ]; then KEY="root"; fi
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: terraform-github-actions-destroy-apply
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Ensure S3 backend
        run: |
          if [ -f backend.tf ] && grep -q 'bucket' backend.tf; then
            exit 0
          fi
          if [ -z "${TF_STATE_BUCKET}" ]; then
            echo "::error::Set TF_STATE_BUCKET."
            exit 1
          fi
          printf '%s\n' 'terraform {' '  backend "s3" {}' '}' > backend.tf

      - name: Terraform init
        run: |
          if [ -f backend.tf ] && grep -q 'bucket' backend.tf; then
            terraform init -input=false -no-color -reconfigure
          elif [ -n "${TF_STATE_BUCKET}" ]; then
            terraform init -input=false -no-color -reconfigure \
              -backend-config="bucket=${TF_STATE_BUCKET}" \
              -backend-config="key=${TF_STATE_KEY}" \
              -backend-config="region=${TF_STATE_REGION}" \
              -backend-config="encrypt=true"
          else
            echo "::error::No S3 backend configured."
            exit 1
          fi

      - name: Download destroy plan artifact
        uses: actions/download-artifact@v4
        with:
          name: destroy-plan-${{ steps.artifact.outputs.key }}
          path: ${{ matrix.directory }}

      - name: Terraform destroy
        run: |
          set -euo pipefail
          if [ ! -f destroy.tfplan ]; then
            echo "::error::destroy.tfplan missing."
            ls -la
            exit 1
          fi
          terraform apply -input=false -no-color destroy.tfplan
