# Modify Infra — Deploy via Pipeline (plan + apply).
#
# ALWAYS runs against the repository default branch (main).
# Triggered by the agent "Deploy via Pipeline" button via workflow_dispatch.
# Feature / PR branches are never used for apply.
name: Terraform AWS Modify Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-aws-modify-deploy-${{ github.repository }}-main
  cancel-in-progress: false

env:
  # Unconditional: always deploy code from main (ignore dispatch ref / feature branches).
  DEPLOY_BRANCH: main
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY || format('{0}/terraform.tfstate', github.repository) }}
  TF_STATE_REGION: ${{ vars.TF_STATE_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"

jobs:
  discover:
    name: "1 · Discover (main)"
    runs-on: ubuntu-latest
    outputs:
      directories: ${{ steps.terraform.outputs.directories }}
      found: ${{ steps.terraform.outputs.found }}
      deploy_branch: ${{ steps.ref.outputs.deploy_branch }}
    steps:
      - name: Resolve deploy branch (always main)
        id: ref
        shell: bash
        run: |
          # Prefer repo default_branch, but Terraform Agent always deploys main.
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          DEPLOY_BRANCH="main"
          if [ -n "$DEFAULT_BRANCH" ] && [ "$DEFAULT_BRANCH" != "main" ]; then
            echo "::notice::Repo default_branch is '$DEFAULT_BRANCH'; agent still deploys 'main'."
          fi
          echo "deploy_branch=$DEPLOY_BRANCH" >> "$GITHUB_OUTPUT"
          echo "Deploy branch (unconditional): $DEPLOY_BRANCH"

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Show deploy ref
        run: |
          echo "deploy_branch=main"
          echo "github.ref=${{ github.ref }} (dispatch ref — ignored)"
          echo "github.sha (dispatch)=${{ github.sha }}"
          echo "checked_out_sha=$(git rev-parse HEAD)"
          echo "checked_out_branch=$(git rev-parse --abbrev-ref HEAD || true)"
          git log -1 --oneline

      - name: Find Terraform directories
        id: terraform
        shell: bash
        run: |
          if ls ./*.tf >/dev/null 2>&1; then
            directories='["."]'
          else
            directories=$(find . -type f -name '*.tf' \
              -not -path '*/.terraform/*' \
              -not -path './.git/*' \
              -printf '%h\n' |
              sed 's|^\./||' |
              sort -u |
              jq -R -s -c 'split("\n") | map(select(length > 0)) | map(if . == "" then "." else . end)')
          fi
          echo "directories=$directories" >> "$GITHUB_OUTPUT"
          if [ "$directories" = "[]" ] || [ -z "$directories" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: "2 · Deploy main - ${{ matrix.directory }}"
    needs: discover
    if: needs.discover.outputs.found == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.discover.outputs.directories) }}
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: terraform-modify-deploy-main
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Ensure S3 backend
        run: |
          if [ -f backend.tf ] && grep -q 'bucket' backend.tf; then
            echo "Using backend.tf from the repo (Settings TF_STATE_BUCKET)."
            exit 0
          fi
          if [ -z "${TF_STATE_BUCKET}" ]; then
            echo "::error::Set Terraform State S3 Bucket in agent Settings or GitHub variable TF_STATE_BUCKET."
            exit 1
          fi
          printf '%s\n' \
            'terraform {' \
            '  backend "s3" {}' \
            '}' > backend.tf

      - name: Terraform init
        run: |
          if [ -f backend.tf ] && grep -q 'bucket' backend.tf; then
            terraform init -input=false -no-color -reconfigure
          elif [ -n "${TF_STATE_BUCKET}" ]; then
            terraform init -input=false -no-color -reconfigure \
              -backend-config="bucket=${TF_STATE_BUCKET}" \
              -backend-config="key=${TF_STATE_KEY}" \
              -backend-config="region=${TF_STATE_REGION}" \
              -backend-config="encrypt=true"
          else
            echo "::error::No S3 backend configured."
            exit 1
          fi

      - name: Terraform plan (from main)
        id: plan
        run: |
          echo "Planning against checked-out main ($(git rev-parse --short HEAD))"
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan 2>&1 | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "plan_exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then
            echo "::error::terraform plan failed"
            exit 1
          fi
          {
            echo "## Modify deploy — Terraform plan on \`main\` (\`${{ matrix.directory }}\`)"
            echo ""
            if [ "$code" -eq 0 ]; then
              echo "No infrastructure changes on main — apply will be skipped."
            else
              echo "Plan has changes on main — apply will run."
              echo ""
              echo '```hcl'
              grep -E '^(Plan:|# )|\sto (add|change|destroy)' plan.txt | head -n 80 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply (main)
        if: steps.plan.outputs.plan_exit == '2'
        timeout-minutes: 30
        run: |
          echo "Applying modify changes from main with OIDC credentials..."
          terraform apply -input=false -no-color -auto-approve tfplan
          echo "## Apply complete (main)" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip apply (no changes on main)
        if: steps.plan.outputs.plan_exit == '0'
        run: |
          echo "Plan on main reported no changes — skipped terraform apply."
          echo "If you expected AWS updates, ensure Deploy pushed Analyze changes to main before this workflow ran."
