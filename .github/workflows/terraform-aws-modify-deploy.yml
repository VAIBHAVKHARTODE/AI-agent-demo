# Modify Infra — Deploy via Pipeline (plan + apply).
#
# Triggered by the agent "Deploy via Pipeline" button (always workflow_dispatch
# on main). Applies infrastructure changes from the default branch.
name: Terraform AWS Modify Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-aws-modify-deploy-${{ github.repository }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY || format('{0}/terraform.tfstate', github.repository) }}
  TF_STATE_REGION: ${{ vars.TF_STATE_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"

jobs:
  discover:
    name: "1 · Discover (modify deploy)"
    runs-on: ubuntu-latest
    outputs:
      directories: ${{ steps.terraform.outputs.directories }}
      found: ${{ steps.terraform.outputs.found }}
    steps:
      - name: Check out dispatched branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Show deploy ref
        run: |
          echo "github.ref=${{ github.ref }}"
          echo "github.ref_name=${{ github.ref_name }}"
          echo "github.sha=${{ github.sha }}"

      - name: Find Terraform directories
        id: terraform
        shell: bash
        run: |
          if ls ./*.tf >/dev/null 2>&1; then
            directories='["."]'
          else
            directories=$(find . -type f -name '*.tf' \
              -not -path '*/.terraform/*' \
              -not -path './.git/*' \
              -printf '%h\n' |
              sed 's|^\./||' |
              sort -u |
              jq -R -s -c 'split("\n") | map(select(length > 0)) | map(if . == "" then "." else . end)')
          fi
          echo "directories=$directories" >> "$GITHUB_OUTPUT"
          if [ "$directories" = "[]" ] || [ -z "$directories" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: "2 · Deploy - ${{ matrix.directory }}"
    needs: discover
    if: needs.discover.outputs.found == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.discover.outputs.directories) }}
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Check out dispatched branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: terraform-modify-deploy
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Ensure S3 backend
        run: |
          if [ -f backend.tf ] && grep -q 'bucket' backend.tf; then
            echo "Using backend.tf from the repo (Settings TF_STATE_BUCKET)."
            exit 0
          fi
          if [ -z "${TF_STATE_BUCKET}" ]; then
            echo "::error::Set Terraform State S3 Bucket in agent Settings or GitHub variable TF_STATE_BUCKET."
            exit 1
          fi
          printf '%s\n' \
            'terraform {' \
            '  backend "s3" {}' \
            '}' > backend.tf

      - name: Terraform init
        run: |
          if [ -f backend.tf ] && grep -q 'bucket' backend.tf; then
            terraform init -input=false -no-color -reconfigure
          elif [ -n "${TF_STATE_BUCKET}" ]; then
            terraform init -input=false -no-color -reconfigure \
              -backend-config="bucket=${TF_STATE_BUCKET}" \
              -backend-config="key=${TF_STATE_KEY}" \
              -backend-config="region=${TF_STATE_REGION}" \
              -backend-config="encrypt=true"
          else
            echo "::error::No S3 backend configured."
            exit 1
          fi

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan 2>&1 | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "plan_exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then
            echo "::error::terraform plan failed"
            exit 1
          fi
          {
            echo "## Modify deploy — Terraform plan (\`${{ matrix.directory }}\`)"
            echo ""
            if [ "$code" -eq 0 ]; then
              echo "No infrastructure changes — apply will be skipped."
            else
              echo "Plan has changes — apply will run."
              echo ""
              echo '```hcl'
              grep -E '^(Plan:|# )|\sto (add|change|destroy)' plan.txt | head -n 80 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        if: steps.plan.outputs.plan_exit == '2'
        timeout-minutes: 30
        run: |
          echo "Applying modify changes with OIDC credentials..."
          terraform apply -input=false -no-color -auto-approve tfplan
          echo "## Apply complete" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip apply (no changes)
        if: steps.plan.outputs.plan_exit == '0'
        run: |
          echo "Plan reported no changes — skipped terraform apply."
