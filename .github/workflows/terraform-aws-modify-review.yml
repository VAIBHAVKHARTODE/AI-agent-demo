# Modify Infra — Terraform plan review via GitHub OIDC (plan only, no apply).
#
# Used by:
# - Agent "Analyze & Modify" when OIDC Role ARN is configured (local AWS keys
#   cannot assume the GitHub OIDC role; plan runs here instead).
# - Manual workflow_dispatch from the Actions tab.
#
# Does NOT apply changes. Deploy via Pipeline uses terraform-aws-modify-deploy.yml.
name: Terraform AWS Modify Review

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref with proposed Terraform changes (branch/SHA). Empty = dispatch ref."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-aws-modify-review-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY || format('{0}/terraform.tfstate', github.repository) }}
  TF_STATE_REGION: ${{ vars.TF_STATE_REGION || 'us-east-1' }}
  TF_IN_AUTOMATION: "true"

jobs:
  discover:
    name: "1 · Discover (modify review)"
    runs-on: ubuntu-latest
    outputs:
      directories: ${{ steps.terraform.outputs.directories }}
      found: ${{ steps.terraform.outputs.found }}
      checkout_ref: ${{ steps.ref.outputs.checkout_ref }}
    steps:
      - name: Resolve checkout ref
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.ref }}" ]; then
            echo "checkout_ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.checkout_ref }}

      - name: Find Terraform directories
        id: terraform
        shell: bash
        run: |
          if ls ./*.tf >/dev/null 2>&1; then
            directories='["."]'
          else
            directories=$(find . -type f -name '*.tf' \
              -not -path '*/.terraform/*' \
              -not -path './.git/*' \
              -printf '%h\n' |
              sed 's|^\./||' |
              sort -u |
              jq -R -s -c 'split("\n") | map(select(length > 0)) | map(if . == "" then "." else . end)')
          fi
          echo "directories=$directories" >> "$GITHUB_OUTPUT"
          if [ "$directories" = "[]" ] || [ -z "$directories" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

  plan:
    name: "2 · Review plan - ${{ matrix.directory }}"
    needs: discover
    if: needs.discover.outputs.found == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.discover.outputs.directories) }}
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.discover.outputs.checkout_ref }}

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: terraform-modify-review
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Ensure S3 backend
        run: |
          if [ -f backend.tf ] && grep -q 'bucket' backend.tf; then
            echo "Using backend.tf from the repo."
            exit 0
          fi
          if [ -z "${TF_STATE_BUCKET}" ]; then
            echo "::error::Set TF_STATE_BUCKET (agent Settings or GitHub variable)."
            exit 1
          fi
          printf '%s\n' \
            'terraform {' \
            '  backend "s3" {}' \
            '}' > backend.tf

      - name: Terraform init
        run: |
          if [ -f backend.tf ] && grep -q 'bucket' backend.tf; then
            terraform init -input=false -no-color -reconfigure
          else
            terraform init -input=false -no-color -reconfigure \
              -backend-config="bucket=${TF_STATE_BUCKET}" \
              -backend-config="key=${TF_STATE_KEY}" \
              -backend-config="region=${TF_STATE_REGION}" \
              -backend-config="encrypt=true"
          fi

      - name: Terraform plan (review only — no apply)
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan 2>&1 | tee plan.txt
          code=${PIPESTATUS[0]}
          set -e
          echo "plan_exit=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then
            echo "::error::terraform plan failed"
            exit 1
          fi
          terraform show -json tfplan > plan.json
          python - <<'PY'
          import json
          with open("plan.json", "r", encoding="utf-8") as f:
              plan = json.load(f)
          resources = []
          counts = {"add": 0, "change": 0, "destroy": 0}
          for rc in plan.get("resource_changes") or []:
              actions = (rc.get("change") or {}).get("actions") or []
              if not actions or actions == ["no-op"] or actions == ["read"]:
                  continue
              action = "update"
              if actions == ["create"]:
                  action = "create"
                  counts["add"] += 1
              elif actions == ["delete"]:
                  action = "delete"
                  counts["destroy"] += 1
              elif "create" in actions and "delete" in actions:
                  action = "replace"
                  counts["add"] += 1
                  counts["destroy"] += 1
              else:
                  counts["change"] += 1
              before = (rc.get("change") or {}).get("before") or {}
              after = (rc.get("change") or {}).get("after") or {}
              tags_b = (before.get("tags") or before.get("tags_all") or {}) if isinstance(before, dict) else {}
              tags_a = (after.get("tags") or after.get("tags_all") or {}) if isinstance(after, dict) else {}
              name_tag = ""
              if isinstance(tags_a, dict):
                  name_tag = tags_a.get("Name") or tags_a.get("name") or ""
              if not name_tag and isinstance(tags_b, dict):
                  name_tag = tags_b.get("Name") or tags_b.get("name") or ""
              resources.append({
                  "address": rc.get("address") or "",
                  "type": rc.get("type") or "",
                  "name": rc.get("name") or "",
                  "actions": actions,
                  "action": action,
                  "name_tag": name_tag or "—",
              })
          summary = (
              f"Plan: {counts['add']} to add, {counts['change']} to change, "
              f"{counts['destroy']} to destroy."
          )
          out = {
              "ok": True,
              "auth_mode": "oidc",
              "summary": summary,
              "counts": counts,
              "resources": resources,
          }
          with open("plan-summary.json", "w", encoding="utf-8") as f:
              json.dump(out, f, indent=2)
          print(summary)
          print(f"Resource changes: {len(resources)}")
          PY
          {
            echo "## Modify review — Terraform plan (\`${{ matrix.directory }}\`)"
            echo ""
            if [ "$code" -eq 0 ]; then
              echo "No infrastructure changes."
            else
              echo "Plan has changes (review before Deploy via Pipeline)."
              echo ""
              echo '```hcl'
              grep -E '^(Plan:|# |  # |~|\+|-)|\sto (add|change|destroy)' plan.txt | head -n 200 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact for agent
        uses: actions/upload-artifact@v4
        with:
          name: modify-review-plan-${{ strategy.job-index }}
          path: |
            ${{ matrix.directory }}/plan-summary.json
            ${{ matrix.directory }}/plan.txt
            ${{ matrix.directory }}/plan.json
          if-no-files-found: warn
          retention-days: 1
